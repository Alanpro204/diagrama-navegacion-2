<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GeoUCI · Diagrama interactivo</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:white;color:#172b39;font:14px system-ui,sans-serif}
    .toolbar{height:64px;display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid #dde3e8;background:#f6f8fa;flex-wrap:wrap}
    .toolbar strong{font-size:16px}
    .toolbar button{padding:8px 12px;border:1px solid #aebbc5;border-radius:6px;background:white;cursor:pointer}
    .toolbar span{color:#52616c}
    .toolbar label{display:flex;align-items:center;gap:6px}
    .canvas{height:calc(100vh - 64px);overflow:auto;padding:20px;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
    .canvas>svg{display:block;max-width:none}
    g[data-node]{cursor:pointer}
    g[data-node]:focus{outline:none}
    g[data-node]>rect{fill:transparent;stroke:transparent;stroke-width:3}
    g[data-node]:focus>rect{stroke:#1769a4}
    @media(hover:hover){g[data-node]:hover>rect{stroke:#1769a4}}
    .popover{position:fixed;width:min(430px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:#fff;border:1px solid #becbd4;border-radius:12px;box-shadow:0 12px 42px #0003;z-index:10}
    .popover[hidden]{display:none}
    .popover header{position:sticky;top:0;background:#fff;padding:16px;border-bottom:1px solid #e1e7eb;z-index:1}
    .popover h2{font-size:18px;line-height:1.35;margin:5px 32px 8px 0}
    .popover p{line-height:1.5;margin:8px 0}
    .close{position:absolute;right:12px;top:12px;border:0;background:#edf2f5;border-radius:5px;cursor:pointer;font-size:22px}
    .content{padding:14px}
    .content figure{margin:0 0 18px;border:1px solid #dce4ea;border-radius:8px;overflow:hidden}
    .content img{width:100%;height:340px;object-fit:contain;display:block;background:#f6f8fa;padding:8px}
    .content figcaption{padding:12px}
    .content strong{display:block}
    .content a{color:#1769a4}
    .na{font-size:28px;font-weight:700;text-align:center;padding:24px}
    .missing{padding:18px;background:#fff0db;color:#7a4b12}
    .hint{font-size:12px;color:#566873}
    @media(max-width:650px){.toolbar{height:auto;min-height:90px}.canvas{height:calc(100vh - 90px)}.toolbar .help{display:none}.content img{height:280px}}
  </style>
</head>
<body>
  <div class="toolbar">
    <strong>GeoUCI · Navegación</strong>
    <button id="fit">Ajustar a pantalla</button>
    <button id="actual">100 %</button>
    <label>Zoom <input id="zoom" type="range" min="10" max="300" value="100"><output id="zoomValue">100 %</output></label>
    <span class="help">Pasa el cursor por un elemento. Pulsa para mantener sus imágenes abiertas.</span>
  </div>
  <div class="canvas" id="canvas">
    <!-- Las áreas interactivas usan las mismas coordenadas y dimensiones que new.svg. -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5680 1200" width="5680" height="1200" role="group" aria-label="Diagrama de navegación de GeoUCI">
      <image href="new.svg" width="5680" height="1200" pointer-events="none"/>
      <g data-node="N01" tabindex="0" role="button" aria-label="Inicio de sesión con cuenta UCI"><rect x="2585" y="240" width="310" height="60"/></g>
      <g data-node="N03" tabindex="0" role="button" aria-label="Recuperación de contraseña UCI"><rect x="2609.8369140625" y="10" width="260.326171875" height="70"/></g>
      <g data-node="N02" tabindex="0" role="button" aria-label="Mapa del campus"><rect x="1110" y="470" width="260" height="60"/></g>
      <g data-node="N07" tabindex="0" role="button" aria-label="Detalles del evento"><rect x="10" y="690" width="260" height="60"/></g>
      <g data-node="N08" tabindex="0" role="button" aria-label="Detalles de la localización"><rect x="490" y="690" width="260" height="60"/></g>
      <g data-node="N11" tabindex="0" role="button" aria-label="Mis eventos"><rect x="1080" y="690" width="260" height="60"/></g>
      <g data-node="N22" tabindex="0" role="button" aria-label="Crear evento"><rect x="860" y="910" width="260" height="60"/></g>
      <g data-node="N24" tabindex="0" role="button" aria-label="Editar evento"><rect x="1300" y="910" width="260" height="60"/></g>
      <g data-node="N12" tabindex="0" role="button" aria-label="Solicitar nueva localización"><rect x="1770" y="690" width="260" height="60"/></g>
      <g data-node="N61" tabindex="0" role="button" aria-label="Mis solicitudes de localización"><rect x="1719.25" y="910" width="361.5" height="60"/></g>
      <g data-node="N29" tabindex="0" role="button" aria-label="Panel de administración"><rect x="4110" y="470" width="260" height="60"/></g>
      <g data-node="N36" tabindex="0" role="button" aria-label="Gestionar localizaciones"><rect x="2610" y="690" width="260" height="60"/></g>
      <g data-node="N62" tabindex="0" role="button" aria-label="Crear localización"><rect x="2430" y="910" width="260" height="60"/></g>
      <g data-node="N63" tabindex="0" role="button" aria-label="Detalles de la localización"><rect x="2790" y="910" width="260" height="60"/></g>
      <g data-node="N40" tabindex="0" role="button" aria-label="Editar localización"><rect x="2790" y="1130" width="260" height="60"/></g>
      <g data-node="N37" tabindex="0" role="button" aria-label="Gestionar categorías"><rect x="3310" y="690" width="260" height="60"/></g>
      <g data-node="N64" tabindex="0" role="button" aria-label="Crear categoría"><rect x="3130" y="910" width="260" height="60"/></g>
      <g data-node="N65" tabindex="0" role="button" aria-label="Detalles de la categoría"><rect x="3476" y="910" width="288" height="60"/></g>
      <g data-node="N44" tabindex="0" role="button" aria-label="Editar categoría"><rect x="3490" y="1130" width="260" height="60"/></g>
      <g data-node="N38" tabindex="0" role="button" aria-label="Atender solicitudes"><rect x="4010" y="690" width="260" height="60"/></g>
      <g data-node="N47" tabindex="0" role="button" aria-label="Detalles de la solicitud"><rect x="4010" y="910" width="260" height="60"/></g>
      <g data-node="N50" tabindex="0" role="button" aria-label="Control de eventos"><rect x="4710" y="690" width="260" height="60"/></g>
      <g data-node="N53" tabindex="0" role="button" aria-label="Detalle del evento"><rect x="4710" y="910" width="260" height="60"/></g>
      <g data-node="N51" tabindex="0" role="button" aria-label="Control de usuarios"><rect x="5410" y="690" width="260" height="60"/></g>
      <g data-node="N58" tabindex="0" role="button" aria-label="Detalle del usuario"><rect x="5410" y="910" width="260" height="60"/></g>
    </svg>
  </div>
  <aside class="popover" id="panel" hidden aria-label="Prototipos asociados">
    <header>
      <button class="close" id="close" aria-label="Cerrar">×</button>
      <div id="nodeId" class="hint"></div>
      <h2 id="title"></h2>
      <p id="note"></p>
    </header>
    <div id="content" class="content"></div>
  </aside>
  <script src="asociaciones.js"></script>
  <script src="navegacion.js"></script>
</body>
</html>
